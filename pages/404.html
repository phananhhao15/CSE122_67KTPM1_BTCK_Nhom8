<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không tìm thấy trang | SiteSafe</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .not-found {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .not-found h1 {
        margin: 0;
        color: var(--color-primary);
        font-size: 5rem;
      }
      .not-found h2 {
        margin: 0 0 10px;
        color: var(--color-primary);
      }
      .not-found p {
        margin: 0 0 20px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <section class="card">
        <h1>404</h1>
        <h2>Không tìm thấy trang</h2>
        <p>Đường dẫn có thể đã thay đổi hoặc không còn tồn tại.</p>
        <a class="btn" href="index.html">Về trang chính</a>
      </section>
    </main>
  </body>
</html>
