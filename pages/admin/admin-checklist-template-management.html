<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý mẫu checklist | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    
  </head>
  <body data-required-role="ADMIN">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <span class="topbar-user-role" data-current-user-role></span>
          </div>
        </header>
        <div class="page-content">
    <main class="template-page">
      <header class="template-header">
        <div>
          <h1>Quản lý mẫu checklist</h1>
          <p>Quản lý danh mục câu hỏi dùng trong các đợt kiểm tra an toàn.</p>
        </div>
        <a class="btn" href="admin-user-management.html">Về quản trị viên</a>
      </header>

      <section class="template-banner" aria-label="Minh họa quản lý checklist">
        <h2>Chuẩn hóa câu hỏi để mỗi lần kiểm tra đều rõ ràng và nhất quán.</h2>
      </section>

      <section class="card" aria-labelledby="template-list-title">
        <div class="template-toolbar">
          <div class="template-filter">
            <label for="work-type-filter">Lọc theo loại công việc</label>
            <select class="form-control" id="work-type-filter">
              <option value="">Tất cả loại công việc</option>
              <option value="Làm việc trên cao">Làm việc trên cao</option>
              <option value="Điện thi công">Điện thi công</option>
              <option value="Nâng hạ vật liệu">Nâng hạ vật liệu</option>
            </select>
          </div>
          <button class="btn btn-success" id="addQuestionButton" type="button">
            + Thêm mới
          </button>
        </div>

        <form class="question-form" id="questionForm">
          <div>
            <label for="questionInput">Nội dung câu hỏi</label>
            <input
              class="form-control"
              id="questionInput"
              type="text"
              placeholder="Nhập câu hỏi kiểm tra"
              required
            />
          </div>
          <div>
            <label for="workTypeInput">Loại công việc</label>
            <select class="form-control" id="workTypeInput" required>
              <option value="Làm việc trên cao">Làm việc trên cao</option>
              <option value="Điện thi công">Điện thi công</option>
              <option value="Nâng hạ vật liệu">Nâng hạ vật liệu</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn btn-success" type="submit">Lưu</button>
            <button class="btn" id="cancelQuestionButton" type="button">
              Hủy
            </button>
          </div>
        </form>

        <h2 id="template-list-title">Danh mục câu hỏi mẫu</h2>
        <div class="table-wrap">
          <table class="table template-table">
            <thead>
              <tr>
                <th scope="col">Mã</th>
                <th scope="col">Câu hỏi kiểm tra</th>
                <th scope="col">Loại công việc</th>
                <th scope="col">Bắt buộc</th>
                <th scope="col">Trạng thái</th>
                <th scope="col">Thao tác</th>
              </tr>
            </thead>
            <tbody id="questionRows"></tbody>
          </table>
          <div class="empty-state" id="emptyState">
            Không có câu hỏi phù hợp.
          </div>
        </div>
      </section>
    </main>
        </div>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/admin.js"></script>
    <script>
      const questionForm = document.getElementById("questionForm");
      const questionRows = document.getElementById("questionRows");
      const workTypeFilter = document.getElementById("work-type-filter");
      const questionInput = document.getElementById("questionInput");
      const workTypeInput = document.getElementById("workTypeInput");
      const emptyState = document.getElementById("emptyState");
      let editingRow = null;
      let nextQuestionNumber = 8;

      // Escape dữ liệu động trước khi chèn vào innerHTML để tránh XSS.
      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(
          /[&<>'"]/g,
          function (character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            }[character];
          },
        );
      }

      function buildQuestionRow(
        id,
        question,
        note,
        workType,
        isRequired = true,
        status = "ACTIVE",
      ) {
        const row = document.createElement("tr");
        row.dataset.workType = workType;
        const noteHtml = note
          ? `<span class="question-note">${escapeHtml(note)}</span>`
          : "";
        const statusHtml =
          status === "ACTIVE"
            ? '<span class="badge badge-success">Đang dùng</span>'
            : '<span class="badge badge-warning">Bản nháp</span>';
        const requiredText = isRequired ? "Có" : "Không";

        row.innerHTML = `<td>${escapeHtml(id)}</td><td class="question-text">${escapeHtml(question)}${noteHtml}</td><td>${escapeHtml(workType)}</td><td>${requiredText}</td><td>${statusHtml}</td><td><div class="action-buttons"><button class="btn btn-edit edit-button" type="button">Sửa</button><button class="btn btn-danger delete-button" type="button">Xóa</button></div></td>`;
        return row;
      }

      function setFormVisible(isVisible) {
        questionForm.classList.toggle("is-visible", isVisible);
        if (!isVisible) {
          questionForm.reset();
          editingRow = null;
        }
      }

      function applyWorkTypeFilter() {
        const selectedType = workTypeFilter.value;
        let visibleRows = 0;

        questionRows.querySelectorAll("tr").forEach(function (row) {
          const shouldShow =
            !selectedType || row.dataset.workType === selectedType;
          row.style.display = shouldShow ? "table-row" : "none";
          if (shouldShow) visibleRows += 1;
        });

        emptyState.style.display = visibleRows ? "none" : "block";
      }

      document
        .getElementById("addQuestionButton")
        .addEventListener("click", function () {
          setFormVisible(true);
          questionInput.focus();
        });

      document
        .getElementById("cancelQuestionButton")
        .addEventListener("click", function () {
          setFormVisible(false);
        });

      questionForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const question = questionInput.value.trim();
        const workType = workTypeInput.value;
        if (!question) {
          alert("Nội dung câu hỏi không được để trống.");
          questionInput.focus();
          return;
        }
        const questionId = editingRow
          ? editingRow.children[0].textContent
          : `CL-${String(nextQuestionNumber).padStart(3, "0")}`;

        if (editingRow) {
          editingRow.dataset.workType = workType;
          const noteSpan = editingRow.querySelector(".question-note");
          const noteText = noteSpan ? noteSpan.textContent : "";
          editingRow.children[1].innerHTML = `${escapeHtml(question)}${noteText ? `<span class="question-note">${escapeHtml(noteText)}</span>` : ""}`;
          editingRow.children[2].textContent = workType;
        } else {
          const row = buildQuestionRow(
            questionId,
            question,
            "",
            workType,
            true,
            "DRAFT",
          );
          questionRows.appendChild(row);
          nextQuestionNumber += 1;
          bindRowActions(row);
        }

        siteSafeApi.saveChecklist({
          id: questionId,
          title: question,
          question,
          workType,
          status: editingRow ? "ACTIVE" : "DRAFT",
          isRequired: true,
        });

        setFormVisible(false);
        applyWorkTypeFilter();
      });

      function bindRowActions(row) {
        row
          .querySelector(".edit-button")
          .addEventListener("click", function () {
            editingRow = row;
            const textNode = row.querySelector(".question-text");
            const noteSpan = textNode.querySelector(".question-note");
            const mainText = noteSpan
              ? textNode.textContent.replace(noteSpan.textContent, "").trim()
              : textNode.textContent.trim();
            questionInput.value = mainText;
            workTypeInput.value = row.dataset.workType;
            setFormVisible(true);
            questionInput.focus();
          });

        row
          .querySelector(".delete-button")
          .addEventListener("click", function () {
            if (!confirm("Bạn có chắc muốn xóa câu hỏi này không?")) return;
            const questionId = row.children[0].textContent;
            row.remove();
            siteSafeApi.deleteChecklist(questionId);
            applyWorkTypeFilter();
          });
      }

      async function initChecklists() {
        questionRows.innerHTML = "";
        const checklists = await siteSafeAdmin.loadChecklists();

        // Cập nhật nextQuestionNumber cao hơn id lớn nhất
        checklists.forEach((c) => {
          const num = parseInt(String(c.id).replace(/\D/g, ""), 10);
          if (!isNaN(num) && num >= nextQuestionNumber) {
            nextQuestionNumber = num + 1;
          }
        });

        // Bổ sung các loại công việc mới vào bộ lọc nếu chưa có
        const existingTypes = new Set(
          Array.from(workTypeFilter.options).map((o) => o.value),
        );
        checklists.forEach((c) => {
          if (c.workType && !existingTypes.has(c.workType)) {
            existingTypes.add(c.workType);
            const opt1 = new Option(c.workType, c.workType);
            workTypeFilter.add(opt1);
            const opt2 = new Option(c.workType, c.workType);
            workTypeInput.add(opt2);
          }
        });

        checklists.forEach(function (checklist) {
          const row = buildQuestionRow(
            checklist.id,
            checklist.question || checklist.title || checklist.label,
            checklist.note || "",
            checklist.workType,
            checklist.isRequired !== false,
            checklist.status || "ACTIVE",
          );
          questionRows.appendChild(row);
          bindRowActions(row);
        });

        applyWorkTypeFilter();
      }

      workTypeFilter.addEventListener("change", applyWorkTypeFilter);
      initChecklists();
    </script>
  </body>
</html>
