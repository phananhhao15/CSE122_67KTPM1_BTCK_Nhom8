<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý khu vực | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    
  </head>
  <body data-required-role="ADMIN">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <span class="topbar-user-role" data-current-user-role></span>
          </div>
        </header>
        <div class="page-content">
    <main class="zones-page">
      <header class="zones-header">
        <div>
          <h1>Quản lý khu vực công trường</h1>
          <p>Quản lý danh mục vùng thi công và mức độ rủi ro tương ứng.</p>
        </div>
        <a class="btn" href="admin-user-management.html">Quản lý người dùng</a>
      </header>

      <section class="zones-banner" aria-label="Minh họa quản lý khu vực">
        <h2>Phân vùng rõ ràng để kiểm soát rủi ro chính xác hơn.</h2>
      </section>

      <section class="card">
        <div class="zones-toolbar">
          <div class="filter-field">
            <label for="zone-search">Tìm kiếm khu vực</label>
            <input
              class="form-control"
              id="zone-search"
              type="search"
              placeholder="Tên hoặc mã khu vực"
            />
          </div>
          <div class="filter-field">
            <label for="risk-filter">Mức rủi ro</label>
            <select class="form-control" id="risk-filter">
              <option value="">Tất cả mức độ</option>
              <option value="CRITICAL">Nghiêm trọng</option>
              <option value="HIGH">Cao</option>
              <option value="MEDIUM">Trung bình</option>
              <option value="LOW">Thấp</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="status-filter">Trạng thái</label>
            <select class="form-control" id="status-filter">
              <option value="">Tất cả trạng thái</option>
              <option value="ACTIVE">Đang hoạt động</option>
              <option value="INACTIVE">Tạm dừng</option>
            </select>
          </div>
          <button class="btn btn-success" id="add-zone-button" type="button">
            + Thêm khu vực
          </button>
        </div>

        <form class="zone-form" id="zone-form">
          <div>
            <label for="zone-code-input">Mã khu vực</label>
            <input
              class="form-control"
              id="zone-code-input"
              type="text"
              placeholder="Ví dụ: LM-A"
              required
            />
          </div>
          <div>
            <label for="zone-name-input">Tên khu vực</label>
            <input
              class="form-control"
              id="zone-name-input"
              type="text"
              placeholder="Nhập tên khu vực"
              required
            />
          </div>
          <div>
            <label for="zone-risk-input">Mức rủi ro</label>
            <select class="form-control" id="zone-risk-input">
              <option value="CRITICAL">Nghiêm trọng</option>
              <option value="HIGH">Cao</option>
              <option value="MEDIUM" selected>Trung bình</option>
              <option value="LOW">Thấp</option>
            </select>
          </div>
          <div>
            <label for="zone-status-input">Trạng thái</label>
            <select class="form-control" id="zone-status-input">
              <option value="ACTIVE">Đang hoạt động</option>
              <option value="INACTIVE">Tạm dừng</option>
            </select>
          </div>
          <div class="form-field--full">
            <label for="zone-description-input">Mô tả</label>
            <input
              class="form-control"
              id="zone-description-input"
              type="text"
              placeholder="Mô tả ngắn về khu vực"
              required
            />
          </div>
          <div class="zone-form-actions">
            <button class="btn btn-success" type="submit">Lưu khu vực</button>
            <button class="btn" id="cancel-zone-button" type="button">
              Hủy
            </button>
          </div>
        </form>

        <h2>Danh mục khu vực</h2>
        <div class="zones-table-wrap">
          <table class="table zones-table">
            <thead>
              <tr>
                <th scope="col">Khu vực</th>
                <th scope="col">Mô tả</th>
                <th scope="col">Mức rủi ro</th>
                <th scope="col">Số sự cố</th>
                <th scope="col">Trạng thái</th>
                <th scope="col">Thao tác</th>
              </tr>
            </thead>
            <tbody id="zone-rows"></tbody>
          </table>
          <div class="empty-state" id="empty-state">
            Không tìm thấy khu vực phù hợp.
          </div>
        </div>
      </section>
    </main>
        </div>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/admin.js"></script>
    <script>
      const zoneRows = document.getElementById("zone-rows");
      const searchInput = document.getElementById("zone-search");
      const riskFilter = document.getElementById("risk-filter");
      const statusFilter = document.getElementById("status-filter");
      const zoneForm = document.getElementById("zone-form");
      const emptyState = document.getElementById("empty-state");
      let editingRow = null;
      let nextZoneNumber = 7;

      const zoneImageUrl =
        "https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=160&q=80";
      const riskLabels = {
        LOW: "Thấp",
        MEDIUM: "Trung bình",
        HIGH: "Cao",
        CRITICAL: "Nghiêm trọng",
      };
      const statusLabels = {
        ACTIVE: "Đang hoạt động",
        INACTIVE: "Tạm dừng",
      };

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(
          /[&<>'"]/g,
          function (character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            }[character];
          },
        );
      }

      // Cập nhật badge mức rủi ro và trạng thái theo dataset của hàng.
      function renderRowBadges(row) {
        const risk = row.dataset.risk;
        const status = row.dataset.status;
        row.children[2].innerHTML = `<span class="badge risk-${escapeHtml(String(risk).toLowerCase())}">${escapeHtml(riskLabels[risk] || risk)}</span>`;
        row.children[4].innerHTML = `<span class="badge ${status === "ACTIVE" ? "badge-success" : "badge-warning"}">${escapeHtml(statusLabels[status] || status)}</span>`;
      }

      function buildZoneRow(zone) {
        const row = document.createElement("tr");
        const imgUrl = zone.image || zoneImageUrl;
        row.dataset.risk = zone.riskLevel;
        row.dataset.status = zone.status;
        const count =
          typeof zone.hazardsCount === "number"
            ? zone.hazardsCount
            : Number(zone.incidentCount) || 0;
        row.innerHTML = `<td><div class="zone-cell"><img class="zone-image" src="${escapeHtml(imgUrl)}" alt="Ảnh ${escapeHtml(zone.code || zone.id)}"><div><span class="zone-name">${escapeHtml(zone.name)}</span><span class="zone-code">${escapeHtml(zone.code || zone.id)}</span></div></div></td><td>${escapeHtml(zone.description)}</td><td></td><td>${count}</td><td></td><td><div class="zone-actions"><button class="btn edit-zone" type="button">Sửa</button><button class="btn btn-danger delete-zone" type="button">Xóa</button></div></td>`;
        renderRowBadges(row);
        return row;
      }

      function showZoneForm(isVisible) {
        zoneForm.classList.toggle("is-visible", isVisible);
        if (!isVisible) {
          zoneForm.reset();
          editingRow = null;
        }
      }

      function filterZones() {
        const keyword = searchInput.value.trim().toLowerCase();
        const risk = riskFilter.value;
        const status = statusFilter.value;
        let visibleRows = 0;

        zoneRows.querySelectorAll("tr").forEach(function (row) {
          const searchableText = row.textContent.toLowerCase();
          const matches =
            (!keyword || searchableText.includes(keyword)) &&
            (!risk || row.dataset.risk === risk) &&
            (!status || row.dataset.status === status);
          row.style.display = matches ? "table-row" : "none";
          if (matches) visibleRows += 1;
        });

        emptyState.style.display = visibleRows ? "none" : "block";
      }

      function bindRowActions(row) {
        row.querySelector(".edit-zone").addEventListener("click", function () {
          editingRow = row;
          document.getElementById("zone-code-input").value =
            row.querySelector(".zone-code").textContent;
          document.getElementById("zone-name-input").value =
            row.querySelector(".zone-name").textContent;
          document.getElementById("zone-description-input").value =
            row.children[1].textContent.trim();
          document.getElementById("zone-risk-input").value = row.dataset.risk;
          document.getElementById("zone-status-input").value =
            row.dataset.status;
          showZoneForm(true);
          document.getElementById("zone-name-input").focus();
        });

        row
          .querySelector(".delete-zone")
          .addEventListener("click", function () {
            if (!confirm("Bạn có chắc muốn xóa khu vực này không?")) return;
            const zoneId = row.querySelector(".zone-code").textContent;
            row.remove();
            siteSafeApi.deleteZone(zoneId);
            filterZones();
          });
      }

      document
        .getElementById("add-zone-button")
        .addEventListener("click", function () {
          editingRow = null;
          showZoneForm(true);
          document.getElementById("zone-code-input").focus();
        });

      document
        .getElementById("cancel-zone-button")
        .addEventListener("click", function () {
          showZoneForm(false);
        });

      zoneForm.addEventListener("submit", function (event) {
        event.preventDefault();
        // Lưu giá trị gốc; chỉ escape khi chèn vào innerHTML.
        const code = document.getElementById("zone-code-input").value.trim();
        const name = document.getElementById("zone-name-input").value.trim();
        const description = document
          .getElementById("zone-description-input")
          .value.trim();
        const risk = document.getElementById("zone-risk-input").value;
        const status = document.getElementById("zone-status-input").value;

        if (!code || !name) {
          alert("Mã vùng và tên khu vực không được để trống.");
          return;
        }

        const isDuplicate = Array.from(zoneRows.querySelectorAll("tr")).some(
          (row) =>
            row !== editingRow &&
            row.querySelector(".zone-code").textContent.trim().toLowerCase() ===
              code.toLowerCase(),
        );
        if (isDuplicate) {
          alert("Mã vùng này đã tồn tại.");
          return;
        }

        const zoneId = editingRow
          ? editingRow.querySelector(".zone-code").textContent
          : code;

        if (editingRow) {
          editingRow.dataset.risk = risk;
          editingRow.dataset.status = status;
          editingRow.querySelector(".zone-code").textContent = code;
          editingRow.querySelector(".zone-name").textContent = name;
          editingRow.children[1].textContent = description;
          renderRowBadges(editingRow);
        } else {
          const row = buildZoneRow({
            code,
            name,
            description,
            riskLevel: risk,
            status,
          });
          zoneRows.appendChild(row);
          nextZoneNumber += 1;
          bindRowActions(row);
        }

        siteSafeApi.saveZone({
          id: zoneId,
          code,
          name,
          description,
          riskLevel: risk,
          status,
        });

        showZoneForm(false);
        filterZones();
      });

      async function initZones() {
        zoneRows.innerHTML = "";
        const zones = await siteSafeAdmin.loadZones();
        zones.forEach(function (zone) {
          const row = buildZoneRow(zone);
          zoneRows.appendChild(row);
          bindRowActions(row);
        });
        filterZones();
      }

      searchInput.addEventListener("input", filterZones);
      riskFilter.addEventListener("change", filterZones);
      statusFilter.addEventListener("change", filterZones);
      initZones();
    </script>
  </body>
</html>
