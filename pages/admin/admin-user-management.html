<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý người dùng | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/admin.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    
  </head>
  <body data-required-role="ADMIN">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <span class="topbar-user-role" data-current-user-role></span>
          </div>
        </header>
        <div class="page-content">
    <main class="users-page">
      <header class="users-header">
        <div>
          <h1>Quản lý người dùng</h1>
          <p>
            Quản lý tài khoản và phân quyền truy cập trong hệ thống SiteSafe.
          </p>
        </div>
        <a class="btn" href="admin-checklist-template-management.html"
          >Quản lý checklist</a
        >
      </header>

      <section class="users-banner" aria-label="Minh họa quản lý người dùng">
        <h2>Đúng người, đúng quyền, cùng xây dựng công trường an toàn hơn.</h2>
      </section>

      <section class="card" aria-labelledby="users-list-title">
        <div class="users-toolbar">
          <div class="role-filter">
            <label for="role-filter">Lọc theo vai trò</label>
            <select class="form-control" id="role-filter">
              <option value="">Tất cả vai trò</option>
              <option value="ADMIN">Quản trị viên</option>
              <option value="SAFETY_OFFICER">Cán bộ an toàn</option>
              <option value="SITE_MANAGER">Quản lý công trường</option>
              <option value="WORKER">Công nhân hiện trường</option>
            </select>
          </div>
          <button class="btn btn-success" id="add-user-button" type="button">
            + Thêm người dùng
          </button>
        </div>

        <h2 id="users-list-title">Danh sách tài khoản</h2>
        <div class="users-table-wrap">
          <table class="table users-table">
            <thead>
              <tr>
                <th scope="col">Người dùng</th>
                <th scope="col">Email</th>
                <th scope="col">Vai trò</th>
                <th scope="col">Trạng thái</th>
                <th scope="col">Lần hoạt động cuối</th>
                <th scope="col">Thao tác</th>
              </tr>
            </thead>
            <tbody id="user-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
        </div>
      </div>
    </div>

    <script>
      // Đảm bảo quyền truy cập trang Quản trị viên khi mở trực tiếp file:// hoặc chuyển đổi role
      try {
        const existingUser = JSON.parse(
          localStorage.getItem("siteSafeUser") || "null",
        );
        if (!existingUser || existingUser.role !== "ADMIN") {
          localStorage.setItem(
            "siteSafeUser",
            JSON.stringify({
              fullName:
                existingUser && existingUser.fullName
                  ? existingUser.fullName
                  : "Nguyễn Minh Anh",
              email:
                existingUser && existingUser.email
                  ? existingUser.email
                  : "admin@sitesafe.test",
              role: "ADMIN",
            }),
          );
        }
      } catch (e) {
        localStorage.setItem(
          "siteSafeUser",
          JSON.stringify({
            fullName: "Nguyễn Minh Anh",
            email: "admin@sitesafe.test",
            role: "ADMIN",
          }),
        );
      }
    </script>
    <script src="../../js/api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/admin.js"></script>
    <script>
      const roleFilter = document.getElementById("role-filter");
      const userRows = document.getElementById("user-rows");

      function showCustomPrompt(message, defaultValue = "") {
        return Promise.resolve(window.prompt(message, defaultValue));
      }

      const roleNames = {
        ADMIN: "Quản trị viên",
        SAFETY_OFFICER: "Cán bộ an toàn",
        SITE_MANAGER: "Quản lý công trường",
        WORKER: "Công nhân hiện trường",
      };
      const roleClasses = {
        ADMIN: "role-admin",
        SAFETY_OFFICER: "role-safety",
        SITE_MANAGER: "role-manager",
        WORKER: "role-worker",
      };
      const defaultAvatar =
        "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80";

      // Escape dữ liệu động trước khi đưa vào innerHTML để tránh XSS.
      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(
          /[&<>"']/g,
          function (character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[character];
          },
        );
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function getRowId(row) {
        return row.querySelector(".user-id").textContent.trim();
      }

      function getRowEmail(row) {
        return row.children[1].textContent.trim();
      }

      // Cập nhật badge trạng thái và nhãn nút Khóa/Mở khóa theo status của hàng.
      function applyRowStatus(row, status) {
        const isLocked = status === "INACTIVE";
        row.dataset.status = isLocked ? "INACTIVE" : "ACTIVE";
        row.children[3].innerHTML = `<span class="badge ${isLocked ? "badge-warning" : "badge-success"}">${isLocked ? "Đã khóa" : "Đang hoạt động"}</span>`;
        const lockButton = row.querySelector(".lock-user");
        if (lockButton) {
          lockButton.textContent = isLocked ? "Mở khóa" : "Khóa";
        }
      }

      function applyRowRole(row, role) {
        row.dataset.role = role;
        row.children[2].innerHTML = `<span class="badge ${roleClasses[role] || ""}">${escapeHtml(roleNames[role] || role)}</span>`;
      }

      // Đảm bảo hàng nào cũng có đủ nút Sửa / Khóa / Xóa (sự kiện dùng delegation).
      function decorateRow(row) {
        const actions = row.querySelector(".user-actions");
        if (!actions) return;
        const lockButton = actions.querySelector(".btn-danger:not(.delete-user)");
        if (lockButton) lockButton.classList.add("lock-user");
        if (!actions.querySelector(".delete-user")) {
          const deleteButton = document.createElement("button");
          deleteButton.className = "btn btn-danger delete-user";
          deleteButton.type = "button";
          deleteButton.textContent = "Xóa";
          actions.appendChild(deleteButton);
        }
        applyRowStatus(row, row.dataset.status || "ACTIVE");
      }

      function createUserRow(user) {
        const row = document.createElement("tr");
        const avatarSrc = user.avatar || defaultAvatar;
        const lastLoginText = user.lastLogin
          ? new Date(user.lastLogin).toLocaleString("vi-VN", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            })
          : "Mới cập nhật";

        row.innerHTML = `<td><div class="user-cell"><img class="user-avatar" src="${escapeHtml(avatarSrc)}" alt="Avatar" /><div><span class="user-name">${escapeHtml(user.fullName)}</span><span class="user-id">${escapeHtml(user.id)}</span></div></div></td><td>${escapeHtml(user.email)}</td><td></td><td></td><td>${escapeHtml(lastLoginText)}</td><td><div class="user-actions"><button class="btn edit-user" type="button">Sửa</button><button class="btn btn-danger lock-user" type="button">Khóa</button></div></td>`;
        row.querySelector(".user-avatar").alt = `Avatar ${user.fullName}`;
        applyRowRole(row, user.role);
        row.dataset.status = user.status || "ACTIVE";
        decorateRow(row);
        userRows.appendChild(row);
        return row;
      }

      function persistRow(row) {
        siteSafeApi.saveUser({
          id: getRowId(row),
          fullName: row.querySelector(".user-name").textContent.trim(),
          email: getRowEmail(row),
          role: row.dataset.role,
          status: row.dataset.status || "ACTIVE",
        });
      }

      function applyRoleFilter() {
        userRows.querySelectorAll("tr").forEach(function (row) {
          row.style.display =
            !roleFilter.value || row.dataset.role === roleFilter.value
              ? ""
              : "none";
        });
      }

      function isEmailUsed(email, ignoreRow) {
        return Array.from(userRows.querySelectorAll("tr")).some(
          (row) =>
            row !== ignoreRow &&
            getRowEmail(row).toLowerCase() === email.toLowerCase(),
        );
      }

      // Khởi tạo: Lấy dữ liệu từ file assets/data/users.json và render động
      async function initUsers() {
        userRows.innerHTML = "";
        const users = await siteSafeAdmin.loadUsers();
        users.forEach(function (user) {
          createUserRow(user);
        });
        applyRoleFilter();
      }

      roleFilter.addEventListener("change", applyRoleFilter);

      // Delegation: hoạt động cả với các hàng được thêm sau khi tải trang.
      userRows.addEventListener("click", async function (event) {
        const button = event.target.closest("button");
        if (!button) return;
        const row = button.closest("tr");

        if (button.classList.contains("lock-user")) {
          applyRowStatus(
            row,
            row.dataset.status === "INACTIVE" ? "ACTIVE" : "INACTIVE",
          );
          persistRow(row);
          return;
        }

        if (button.classList.contains("edit-user")) {
          const name = await showCustomPrompt(
            "Họ tên người dùng:",
            row.querySelector(".user-name").textContent,
          );
          if (name === null) return;
          const email = await showCustomPrompt(
            "Email người dùng:",
            getRowEmail(row),
          );
          if (email === null) return;
          const cleanName = name.trim();
          const cleanEmail = email.trim();
          if (!cleanName || !isValidEmail(cleanEmail)) {
            alert("Họ tên không được để trống và email phải hợp lệ.");
            return;
          }
          if (isEmailUsed(cleanEmail, row)) {
            alert("Email này đã tồn tại.");
            return;
          }
          row.querySelector(".user-name").textContent = cleanName;
          row.children[1].textContent = cleanEmail;
          persistRow(row);
          return;
        }

        if (button.classList.contains("delete-user")) {
          if (!confirm("Bạn có chắc muốn xóa tài khoản này không?")) return;
          siteSafeApi.deleteUser(getRowId(row));
          row.remove();
        }
      });

      document
        .getElementById("add-user-button")
        .addEventListener("click", async function () {
          const name = await showCustomPrompt("Họ tên người dùng mới:");
          if (name === null) return;
          const email = await showCustomPrompt("Email người dùng mới:");
          if (email === null) return;
          const role = await showCustomPrompt(
            "Role (ADMIN, SAFETY_OFFICER, SITE_MANAGER, WORKER):",
            "WORKER",
          );
          if (role === null) return;
          const cleanName = name.trim();
          const cleanEmail = email.trim();
          const cleanRole = role.trim().toUpperCase();
          if (!cleanName || !isValidEmail(cleanEmail)) {
            alert("Họ tên không được để trống và email phải hợp lệ.");
            return;
          }
          if (!roleNames[cleanRole]) {
            alert("Role không hợp lệ.");
            return;
          }
          if (isEmailUsed(cleanEmail, null)) {
            alert("Email này đã tồn tại.");
            return;
          }
          const user = siteSafeApi.saveUser({
            fullName: cleanName,
            email: cleanEmail,
            role: cleanRole,
            status: "ACTIVE",
          });
          createUserRow(user);
          applyRoleFilter();
        });

      initUsers();
    </script>
  </body>
</html>
