<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ | SiteSafe</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .page {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }
      .card h1 {
        margin-top: 0;
        color: var(--color-primary);
      }
      .field {
        margin: 16px 0;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .message {
        min-height: 22px;
        color: var(--color-success);
      }
      @media (max-width: 600px) {
        .page {
          width: min(560px, calc(100% - 24px));
        }
        .actions .btn {
          flex: 1;
        }
      }
    </style>
  </head>
  <body data-required-role="ANY">
    <main class="page">
      <section class="card">
        <h1>Hồ sơ cá nhân</h1>
        <p>Cập nhật thông tin hiển thị của tài khoản SiteSafe.</p>
        <form id="profileForm">
          <div class="field">
            <label for="fullName">Họ tên</label
            ><input class="form-control" id="fullName" required />
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input class="form-control" id="email" type="email" required />
          </div>
          <div class="field">
            <label for="phone">Số điện thoại</label
            ><input class="form-control" id="phone" />
          </div>
          <p class="message" id="message" role="status"></p>
          <div class="actions">
            <button class="btn btn-success" type="submit">Lưu hồ sơ</button
            ><a class="btn" href="index.html">Trang chính</a>
          </div>
        </form>
      </section>
    </main>
    <script src="../js/main.js"></script>
    <script>
      const profile = JSON.parse(localStorage.getItem("siteSafeUser") || "{}");
      fullName.value = profile.fullName || "";
      email.value = profile.email || "";
      phone.value = profile.phone || "";
      profileForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const updatedProfile = {
          ...profile,
          fullName: fullName.value.trim(),
          email: email.value.trim(),
          phone: phone.value.trim(),
        };
        localStorage.setItem("siteSafeUser", JSON.stringify(updatedProfile));
        message.textContent = "Đã lưu thông tin hồ sơ.";
      });
    </script>
  </body>
</html>
