<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | SiteSafe</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
  <style>
    :root {
      --background: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --primary: var(--color-primary);
      --primary-dark: #0f172a;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--background);
      font-family: Arial, sans-serif;
    }

    .background-grid {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 12px;
      padding: 18px;
      background-image: url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1800&q=80");
      background-position: center;
      background-size: cover;
      opacity: 0.72;
    }

    /* Ảnh nền công trường ở góc trên bên trái. */
    .background-card--one {
      grid-column: 1 / 4;
      grid-row: 1 / 4;
      background-image: url("../../assets/images/anhdangnhap2.png");
    }

    /* Ảnh nền công nhân đang làm việc ở khu vực phía trên. */
    .background-card--two {
      grid-column: 4 / 8;
      grid-row: 1 / 3;
      background-image: url("../../assets/images/ảnh\ nền\ phần\ đăng\ nhập\ bên\ trái.jpg");
    }

    /* Ảnh nền máy móc thi công ở góc trên bên phải. */
    .background-card--three {
      grid-column: 8 / 13;
      grid-row: 1 / 4;
      background-image: url("../../assets/images/anhdangnhap.png");
    }

    /* Ảnh nền công trường đặt so le ở giữa bên trái. */
    .background-card--four {
      grid-column: 1 / 5;
      grid-row: 4 / 7;
      background-image: url("../../assets/images/nen.png");
    }

    /* Ảnh nền kết cấu xây dựng đặt so le ở giữa bên phải. */
    .background-card--five {
      grid-column: 9 / 13;
      grid-row: 4 / 8;
      background-image: url("../../assets/images/anhdangnhap1.png");
    }

    /* Ảnh nền khu vực thi công ở góc dưới bên trái. */
    .background-card--six {
      grid-column: 2 / 7;
      grid-row: 7 / 9;
      background-image: url("../../assets/images/anhlogin.png");
    }

    .background-card {
      min-width: 0;
      min-height: 0;
      border-radius: 16px;
      background-position: center;
      background-size: cover;
      filter: saturate(0.8);
    }

    .background-shade {
      position: fixed;
      inset: 0;
      background: rgb(24 28 36 / 58%);
    }

    .login-card {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(420px, calc(100% - 32px));
      padding: 38px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 38%);
      transform: translate(-50%, -50%);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      width: 100%;
      gap: 8px;
      margin-bottom: 34px;
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .brand-logo {
      display: block;
      width: auto;
      max-width: 320px;
      height: 140px;
      object-fit: contain;
      filter: contrast(1.3) brightness(1.12) saturate(1.2);
    }

    .brand-tagline {
      position: relative;
      padding-bottom: 10px;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.4;
      text-align: center;
    }

    .brand-tagline::after {
      position: absolute;
      right: 25%;
      bottom: 0;
      left: 25%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
      content: "";
    }

    h1 {
      margin: 0 0 26px;
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      font: inherit;
    }

    select {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      color: var(--text);
      background: var(--color-white);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      font: inherit;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(37 99 235 / 14%);
    }

    .step-note {
      margin: -10px 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .is-hidden {
      display: none;
    }

    .back-button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(37 99 235 / 14%);
    }

    .reset-link {
      display: inline-block;
      margin-top: 9px;
      color: var(--primary);
      font-size: 0.88rem;
      text-decoration: none;
    }

    .reset-link:hover {
      text-decoration: underline;
    }

    .submit-button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      color: var(--color-white);
      background: var(--primary);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    .submit-button:hover {
      background: var(--primary-dark);
    }

    .form-message {
      min-height: 20px;
      margin: 14px 0 0;
      color: var(--error);
      font-size: 0.88rem;
    }

    @media (max-width: 480px) {
      .background-grid {
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(10, 1fr);
        gap: 8px;
        padding: 10px;
      }

      .background-card--one {
        grid-column: 1 / 4;
        grid-row: 1 / 3;
      }

      .background-card--two {
        grid-column: 4 / 7;
        grid-row: 1 / 3;
      }

      .background-card--three {
        grid-column: 1 / 3;
        grid-row: 3 / 6;
      }

      .background-card--four {
        grid-column: 5 / 7;
        grid-row: 3 / 6;
      }

      .background-card--five {
        grid-column: 1 / 4;
        grid-row: 8 / 11;
      }

      .background-card--six {
        grid-column: 4 / 7;
        grid-row: 8 / 11;
      }

      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body>
  <main aria-label="Đăng nhập SiteSafe">
    <section class="background-grid" aria-hidden="true">
      <div class="background-card background-card--one"></div>
      <div class="background-card background-card--two"></div>
      <div class="background-card background-card--three"></div>
      <div class="background-card background-card--four"></div>
      <div class="background-card background-card--five"></div>
      <div class="background-card background-card--six"></div>
    </section>
    <div class="background-shade" aria-hidden="true"></div>

    <section class="login-card">
      <!-- Sử dụng logo SiteSafe chính thức từ thư mục assets/images. -->
      <div class="brand" aria-label="Logo SiteSafe">
        <img class="brand-logo" src="../../assets/images/sitesafe-logo.png" alt="Logo SiteSafe" />
        <span class="brand-tagline">Đồng hành an toàn, vững bước mọi công trình.</span>
      </div>

      <h1>Đăng nhập bằng địa chỉ email</h1>

      <form id="loginForm" novalidate>
        <div id="roleStep">
          <p class="step-note">
            Chọn vai trò để tiếp tục đến phần đăng nhập.
          </p>
          <div class="form-group">
            <label for="role">Vai trò đăng nhập</label>
            <select id="role" name="role" required>
              <option value="">Chọn vai trò của bạn</option>
              <option value="WORKER">Công nhân hiện trường</option>
              <option value="SAFETY_OFFICER">Cán bộ an toàn</option>
              <option value="SITE_MANAGER">Quản lý công trường</option>
              <option value="ADMIN">Quản trị viên</option>
            </select>
          </div>
          <button class="submit-button" id="continueButton" type="button">
            Tiếp tục
          </button>
        </div>

        <div class="is-hidden" id="credentialsStep">
          <p class="step-note" id="selectedRoleText"></p>
          <div class="form-group">
            <label for="email">Địa chỉ email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="ban@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
              placeholder="Nhập mật khẩu của bạn" required />
            <a class="reset-link" href="forgot-password.html">Đặt lại mật khẩu</a>
          </div>

          <button class="submit-button" type="submit">Đăng nhập</button>
          <button class="back-button" id="backButton" type="button">
            Đổi vai trò
          </button>
        </div>
        <p class="form-message" id="formMessage" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const formMessage = document.getElementById("formMessage");
    const roleSelect = document.getElementById("role");
    const roleStep = document.getElementById("roleStep");
    const credentialsStep = document.getElementById("credentialsStep");
    const continueButton = document.getElementById("continueButton");
    const backButton = document.getElementById("backButton");
    const selectedRoleText = document.getElementById("selectedRoleText");

    const dashboardByRole = {
      ADMIN: "../admin/admin-user-management.html",
      SAFETY_OFFICER: "../safety-officer/safety-dashboard.html",
      SITE_MANAGER: "../manager/manager-safety-report.html",
      WORKER: "../worker/worker-my-hazards.html",
    };

    continueButton.addEventListener("click", function () {
      if (!roleSelect.value) {
        formMessage.textContent = "Vui lòng chọn vai trò trước khi tiếp tục.";
        return;
      }

      selectedRoleText.textContent = `Vai trò đã chọn: ${roleSelect.options[roleSelect.selectedIndex].text}`;
      roleStep.classList.add("is-hidden");
      credentialsStep.classList.remove("is-hidden");
      formMessage.textContent = "";
      document.getElementById("email").focus();
    });

    backButton.addEventListener("click", function () {
      credentialsStep.classList.add("is-hidden");
      roleStep.classList.remove("is-hidden");
      formMessage.textContent = "";
    });

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        formMessage.textContent = "Vui lòng nhập địa chỉ email và mật khẩu.";
        return;
      }

      if (!email.includes("@")) {
        formMessage.textContent = "Vui lòng nhập địa chỉ email hợp lệ.";
        return;
      }

      localStorage.setItem(
        "siteSafeUser",
        JSON.stringify({ email, role: roleSelect.value }),
      );
      const next = new URLSearchParams(window.location.search).get("next");
      if (next && next.startsWith("pages/")) {
        window.location.href = next;
        return;
      }

      window.location.href = dashboardByRole[roleSelect.value];
    });
  </script>
</body>

</html>
