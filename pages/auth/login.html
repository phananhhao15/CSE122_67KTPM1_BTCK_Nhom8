<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Đăng nhập hệ thống quản lý an toàn công trường SiteSafe. Kết nối công nhân, cán bộ an toàn và ban chỉ huy." />
  <title>Đăng nhập | SiteSafe</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/auth.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>

<body>
  <main class="auth-login-wrapper" aria-label="Đăng nhập SiteSafe">
    <!-- Lưới ảnh nền công trường -->
    <section class="auth-background-grid" aria-hidden="true">
      <div class="auth-background-card auth-bg-card--one"></div>
      <div class="auth-background-card auth-bg-card--two"></div>
      <div class="auth-background-card auth-bg-card--three"></div>
      <div class="auth-background-card auth-bg-card--four"></div>
      <div class="auth-background-card auth-bg-card--five"></div>
      <div class="auth-background-card auth-bg-card--six"></div>
    </section>
    <div class="auth-background-shade" aria-hidden="true"></div>

    <!-- Hộp form đăng nhập -->
    <section class="auth-card" aria-labelledby="loginHeading">
      <a class="auth-brand" href="../../index.html" title="Trang chủ SiteSafe">
        <img class="auth-brand-logo" src="../../assets/images/sitesafe-logo.png" alt="Logo SiteSafe" />
        <span class="auth-brand-tagline">Đồng hành an toàn, vững bước mọi công trình.</span>
      </a>

      <h1 class="auth-heading" id="loginHeading">Đăng nhập hệ thống</h1>
      <p class="auth-subheading">Truy cập để thực hiện kiểm tra an toàn và giám sát công trường.</p>

      <!-- Vùng hiển thị lỗi / thông báo chung -->
      <div class="auth-alert auth-alert--error" id="loginAlert" data-auth-alert="general" role="alert"
        aria-live="polite" style="display: none;">
        <span class="auth-alert-icon" id="loginAlertIcon" data-auth-alert-icon>⚠️</span>
        <div class="auth-alert-content">
          <div id="loginAlertMessage" data-auth-alert-message>Thông báo lỗi hệ thống</div>
          <div class="auth-alert-action" id="loginAlertAction" style="display: none;">
            <button type="button" id="loginAlertRetryBtn" data-auth-action="retry">Thử lại</button>
          </div>
        </div>
      </div>

      <form id="loginForm" data-auth-form="login" novalidate>
        <!-- Chọn vai trò công tác (Role Selection) -->
        <div class="worker-form-group auth-form-group">
          <label class="auth-label" for="loginRole">
            <span>Vai trò công tác</span>
            <small style="color: #64748b; font-weight: normal;">(Tùy chọn kiểm tra phân quyền)</small>
          </label>
          <select class="auth-select" id="loginRole" name="role" data-auth-field="role">

            <option value="WORKER">Công nhân hiện trường</option>
            <option value="SAFETY_OFFICER">Cán bộ an toàn</option>
            <option value="SITE_MANAGER">Quản lý công trường</option>
            <option value="ADMIN">Quản trị viên </option>
          </select>
          <span class="auth-field-error" id="loginRoleError" data-auth-error="role" style="display: none;"></span>
        </div>

        <!-- Ô Email hoặc Tên đăng nhập -->
        <div class="worker-form-group auth-form-group">
          <label class="auth-label" for="loginEmail">
            <span>Email hoặc Tên đăng nhập <span class="auth-label-required">*</span></span>
          </label>
          <input class="auth-input" id="loginEmail" name="emailOrUsername" type="text" autocomplete="username"
            placeholder="ten@sitesafe.test hoặc Mã USR" data-auth-field="email" data-auth-type="email-or-username"
            required />
          <span class="auth-field-error" id="loginEmailError" data-auth-error="email" style="display: none;"></span>
        </div>

        <!-- Ô Mật khẩu có nút hiện/ẩn -->
        <div class="worker-form-group auth-form-group">
          <label class="auth-label" for="loginPassword">
            <span>Mật khẩu <span class="auth-label-required">*</span></span>
            <a class="auth-btn-link" href="forgot-password.html" data-auth-link="forgot-password">Quên mật khẩu?</a>
          </label>
          <div class="auth-password-wrapper">
            <input class="auth-input" id="loginPassword" name="password" type="password" autocomplete="current-password"
              placeholder="Nhập mật khẩu của bạn" data-auth-field="password" required />
            <button class="auth-password-toggle" id="togglePasswordBtn" type="button" aria-label="Hiện mật khẩu"
              data-auth-action="toggle-password" data-target-input="loginPassword">
              👁️
            </button>
          </div>
          <span class="auth-field-error" id="loginPasswordError" data-auth-error="password"
            style="display: none;"></span>
        </div>

        <!-- Nút đăng nhập có trạng thái loading (bật bằng class .auth-btn--loading) -->
        <button class="auth-btn auth-btn-primary" id="loginSubmitBtn" type="submit" data-auth-action="submit">
          <span class="auth-btn-spinner" data-auth-spinner></span>
          <span class="auth-btn-text-default" data-auth-btn-text="default">Đăng nhập</span>
          <span class="auth-btn-text-loading" data-auth-btn-text="loading">Đang xác thực...</span>
        </button>
      </form>

      <!-- Điều hướng tới trang đăng ký -->
      <div class="auth-footer-nav">
        Chưa có tài khoản?
        <a href="register.html" data-auth-link="register">Đăng ký tài khoản mới</a>
      </div>
    </section>
  </main>

  <!-- Nạp đúng thứ tự bắt buộc: api.js -> main.js -> auth.js -->
  <script src="../../js/api.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/modules/auth.js"></script>

  <!-- Script trợ giúp giao diện cơ bản (chưa viết logic đăng nhập) -->
  <script>
    (function () {
      "use strict";

      // Nút ẩn/hiện mật khẩu (UI interaction)
      const toggleBtn = document.getElementById("togglePasswordBtn");
      const passInput = document.getElementById("loginPassword");
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener("click", function () {
          const isPass = passInput.type === "password";
          passInput.type = isPass ? "text" : "password";
          toggleBtn.textContent = isPass ? "🙈" : "👁️";
          toggleBtn.setAttribute("aria-label", isPass ? "Ẩn mật khẩu" : "Hiện mật khẩu");
        });
      }
    })();
  </script>
</body>

</html>
