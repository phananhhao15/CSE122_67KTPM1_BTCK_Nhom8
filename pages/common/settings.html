<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <style>
      .setting {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--spacing-4);
        padding: var(--spacing-4) 0;
        border-bottom: 1px solid var(--color-border);
      }
      .setting label {
        color: var(--color-neutral-700);
        font-weight: var(--font-weight-semibold);
      }
      .setting small {
        display: block;
        margin-top: var(--spacing-1);
        color: var(--color-neutral-500);
        font-weight: var(--font-weight-normal);
      }
      .message {
        min-height: 22px;
        color: var(--color-success-text);
      }
      @media (max-width: 480px) {
        .setting {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body data-required-role="ANY">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <div class="topbar-user-info">
              <span class="topbar-user-name">Hệ thống quản lý</span>
              <span class="topbar-user-role" data-current-user-role></span>
            </div>
          </div>
        </header>
        <main class="page-content">
          <div class="common-page">
            <section class="card common-card common-card--narrow">
              <header class="common-header">
                <div>
                  <h1 class="common-title">Cài đặt</h1>
                  <p class="page-description">
                    Điều chỉnh trải nghiệm sử dụng SiteSafe.
                  </p>
                </div>
              </header>
              <form id="settingsForm">
                <div class="setting">
                  <label for="emailAlerts"
                    >Nhận email cảnh báo<small
                      >Thông báo khi có sự cố nghiêm trọng.</small
                    ></label
                  ><input id="emailAlerts" type="checkbox" />
                </div>
                <div class="setting">
                  <label for="compactMode"
                    >Chế độ bảng gọn<small
                      >Hiển thị nhiều dữ liệu hơn trên màn hình.</small
                    ></label
                  ><input id="compactMode" type="checkbox" />
                </div>
                <p class="message" id="message" role="status"></p>
                <button class="btn btn-success" type="submit">
                  Lưu cài đặt
                </button>
              </form>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/common.js"></script>
    <script>
      const settings = JSON.parse(
        localStorage.getItem("siteSafeSettings") || "{}",
      );
      emailAlerts.checked = settings.emailAlerts !== false;
      compactMode.checked = Boolean(settings.compactMode);
      settingsForm.addEventListener("submit", function (event) {
        event.preventDefault();
        localStorage.setItem(
          "siteSafeSettings",
          JSON.stringify({
            emailAlerts: emailAlerts.checked,
            compactMode: compactMode.checked,
          }),
        );
        message.textContent = "Đã lưu cài đặt.";
      });
    </script>
  </body>
</html>
