<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông báo | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <style>
      .notification {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--spacing-4);
        padding: var(--spacing-4) 0;
        border-bottom: 1px solid var(--color-border);
      }
      .notification.unread {
        font-weight: var(--font-weight-semibold);
      }
      .notification small {
        display: block;
        margin-top: var(--spacing-1);
        color: var(--color-neutral-500);
        font-weight: var(--font-weight-normal);
      }
    </style>
  </head>
  <body data-required-role="ANY">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <div class="topbar-user-info">
              <span class="topbar-user-name">Hệ thống quản lý</span>
              <span class="topbar-user-role" data-current-user-role></span>
            </div>
          </div>
        </header>
        <main class="page-content">
          <div class="common-page">
            <section class="card common-card common-card--wide">
              <header class="page-header common-header">
                <div>
                  <h1 class="common-title">Thông báo</h1>
                  <p class="page-description">
                    Các cập nhật mới liên quan đến an toàn công trường.
                  </p>
                </div>
                <div class="page-actions">
                  <button class="btn" id="clearButton" type="button">
                    Đánh dấu đã đọc
                  </button>
                </div>
              </header>
              <div id="notificationList"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/common.js"></script>
    <script>
      const defaultNotifications = [
        {
          id: "NT-001",
          title: "Có sự cố mới cần xem xét",
          detail: "Lan can sàn tầng 12 đang chờ xử lý.",
          read: false,
        },
        {
          id: "NT-002",
          title: "Checklist đã được duyệt",
          detail: "Checklist an toàn điện đã hoàn thành.",
          read: false,
        },
        {
          id: "NT-003",
          title: "Hành động khắc phục sắp đến hạn",
          detail: "Cần cập nhật tiến độ trước ngày 25/09/2026.",
          read: true,
        },
      ];
      let notifications =
        JSON.parse(localStorage.getItem("siteSafeNotifications") || "null") ||
        defaultNotifications;
      function renderNotifications() {
        notificationList.innerHTML = notifications
          .map(
            (item) =>
              `<article class="notification ${item.read ? "" : "unread"}"><div>${item.title}<small>${item.detail}</small></div><span class="badge ${item.read ? "badge-success" : "badge-warning"}">${item.read ? "Đã đọc" : "Mới"}</span></article>`,
          )
          .join("");
      }
      clearButton.addEventListener("click", function () {
        notifications = notifications.map((item) => ({ ...item, read: true }));
        localStorage.setItem(
          "siteSafeNotifications",
          JSON.stringify(notifications),
        );
        renderNotifications();
      });
      renderNotifications();
    </script>
  </body>
</html>
