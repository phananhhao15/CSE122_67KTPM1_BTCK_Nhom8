<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huấn luyện an toàn | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/training.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
  </head>
  <body data-required-role="ANY">
    <div class="app-layout">
      <aside class="sidebar" aria-label="Điều hướng chính"></aside>
      <div class="main-content">
        <header class="topbar">
          <span class="topbar-title">SiteSafe</span>
          <div class="topbar-user">
            <div class="topbar-user-info">
              <span class="topbar-user-name">Hệ thống quản lý</span>
              <span class="topbar-user-role" data-current-user-role></span>
            </div>
          </div>
        </header>
        <main class="page-content">
    <div class="training-container">
      <section class="training-card">
        <header class="page-header">
          <div>
            <h1>Huấn luyện an toàn lao động</h1>
            <p class="page-description">Các khóa học và tài liệu đào tạo an toàn bắt buộc cho nhân sự công trường.</p>
          </div>
        </header>
        
        <div class="training-grid" id="trainingList"></div>
      </section>
    </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/modules/training.js"></script>
    <script>
      const trainingList = document.getElementById("trainingList");
      const trainings = siteSafeTraining.getTrainings();

      trainingList.innerHTML = trainings.map(course => `
        <article class="course-card">
          <img src="${course.image}" alt="${course.title}" />
          <div class="course-body">
            <h3 class="course-title">${course.title}</h3>
            <p class="course-desc">${course.description}</p>
            <div class="course-footer">
              <span class="badge ${course.status === 'COMPLETED' ? 'badge-success' : course.status === 'IN_PROGRESS' ? 'badge-warning' : ''}">
                ${course.status === 'COMPLETED' ? 'Đã hoàn thành' : course.status === 'IN_PROGRESS' ? 'Đang học' : 'Chưa học'}
              </span>
              <small>${course.duration}</small>
            </div>
          </div>
        </article>
      `).join("");
    </script>
  </body>
</html>
