<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo cáo nguy cơ an toàn | SiteSafe</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <style>
      .hazard-page {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .hazard-header {
        margin-bottom: 24px;
      }

      .hazard-header h1 {
        margin: 0 0 6px;
        color: var(--color-primary);
        font-size: clamp(1.7rem, 4vw, 2.3rem);
      }

      .hazard-header p {
        margin: 0;
        color: #64748b;
      }

      .hazard-form .form-group {
        margin-bottom: 20px;
      }

      .hazard-form label,
      .upload-label {
        display: block;
        margin-bottom: 7px;
        color: var(--color-primary);
        font-weight: 600;
      }

      .hazard-form textarea {
        min-height: 140px;
        resize: vertical;
      }

      /* Thay URL ảnh minh họa bằng ảnh sự cố thực tế của công trường khi có dữ liệu. */
      /* Prompt AI: "Realistic construction site safety hazard, worker noticing an exposed electrical cable near a wet work area, warning signs, hard hats and reflective vests, documentary photography." */
      .hazard-image-guide {
        min-height: 150px;
        margin-bottom: 10px;
        padding: 24px;
        color: #475569;
        background: #f8fafc
          url("https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=900&q=80")
          center / cover;
        background-blend-mode: screen;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        text-align: center;
      }

      .hazard-image-guide p {
        margin: 0;
        padding: 8px;
        background: rgb(255 255 255 / 88%);
        border-radius: 6px;
      }

      .preview-image {
        display: none;
        width: 100%;
        max-height: 300px;
        margin-top: 12px;
        border-radius: 8px;
        object-fit: contain;
        background: #f1f5f9;
      }

      .upload-input {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: var(--color-white);
        font: inherit;
      }

      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .form-actions .btn {
        min-height: 46px;
      }

      .ai-result {
        display: none;
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        color: #7c2d12;
        background: #ffedd5;
        border-left: 4px solid var(--color-warning);
        border-radius: 4px;
      }

      @media (max-width: 600px) {
        .hazard-page {
          width: min(560px, calc(100% - 24px));
          padding: 20px 0;
        }

        .form-actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        .form-actions .btn {
          width: 100%;
          min-height: 52px;
        }
      }
    </style>
  </head>
  <body data-required-role="WORKER">
    <main class="hazard-page">
      <header class="hazard-header">
        <h1>Báo cáo nguy cơ an toàn</h1>
        <p>Ghi nhận nhanh nguy cơ để đội ngũ SiteSafe xử lý kịp thời.</p>
      </header>

      <form class="card hazard-form" id="hazardForm" action="#" method="post">
        <div class="form-group">
          <label for="hazard-zone">Khu vực phát hiện</label>
          <select class="form-control" id="hazard-zone" name="zone" required>
            <option value="">Chọn khu vực</option>
            <option value="LM-STR">Khu kết cấu và giàn giáo</option>
            <option value="LM-MAT">Kho vật tư và thiết bị nâng</option>
            <option value="BR-PILE">
              Khu thi công cọc và mố cầu phía Đông
            </option>
          </select>
        </div>

        <div class="form-group">
          <label for="hazard-description">Mô tả nguy cơ</label>
          <textarea
            class="form-control"
            id="hazard-description"
            name="description"
            placeholder="Mô tả điều bạn quan sát được, vị trí cụ thể và nguy cơ có thể xảy ra..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <span class="upload-label">Ảnh hiện trường</span>
          <div class="hazard-image-guide">
            <p>Chọn ảnh rõ nét về nguy cơ để cán bộ an toàn dễ đánh giá.</p>
          </div>
          <input
            class="upload-input"
            id="hazard-image"
            name="image"
            type="file"
            accept="image/*"
          />
          <img
            class="preview-image"
            id="imagePreview"
            alt="Ảnh xem trước nguy cơ an toàn"
          />
        </div>

        <div class="form-actions">
          <button class="btn btn-warning" id="classifyButton" type="button">
            AI Phân loại nguy cơ
          </button>
          <button class="btn btn-danger" type="submit">Gửi báo cáo</button>
        </div>
        <div
          class="ai-result"
          id="aiResult"
          role="status"
          aria-live="polite"
        ></div>
      </form>
    </main>

    <script src="../../js/api.js"></script>
    <script>
      const imageInput = document.getElementById("hazard-image");
      const imagePreview = document.getElementById("imagePreview");
      const classifyButton = document.getElementById("classifyButton");
      const aiResult = document.getElementById("aiResult");

      imageInput.addEventListener("change", function () {
        const selectedFile = imageInput.files[0];

        if (!selectedFile) {
          imagePreview.style.display = "none";
          imagePreview.removeAttribute("src");
          return;
        }

        imagePreview.src = URL.createObjectURL(selectedFile);
        imagePreview.style.display = "block";
      });

      classifyButton.addEventListener("click", function () {
        aiResult.textContent =
          "Phân loại mẫu: Vui lòng kiểm tra thủ công và bổ sung biện pháp kiểm soát trước khi gửi báo cáo.";
        aiResult.style.display = "block";
      });

      document
        .getElementById("hazardForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const currentUser = JSON.parse(
            localStorage.getItem("siteSafeUser") || "{}",
          );
          const zone = document.getElementById("hazard-zone").value;
          const description = document
            .getElementById("hazard-description")
            .value.trim();

          siteSafeApi.saveHazard({
            title: `Nguy cơ mới tại ${zone}`,
            description,
            zoneId: zone,
            category: "Chưa phân loại",
            riskLevel: "MEDIUM",
            status: "OPEN",
            reportedBy: currentUser.email || "WORKER",
            reportedAt: new Date().toISOString(),
            image: imagePreview.src || "",
          });

          aiResult.textContent = "Đã lưu báo cáo nguy cơ thành công.";
          aiResult.style.display = "block";
        });
    </script>
    <script src="../../js/main.js"></script>
  </body>
</html>
